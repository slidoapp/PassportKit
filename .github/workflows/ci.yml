name: CI

# CI runs on pull requests only. The ruleset of main requires the `lint`, `build` and `docs` checks and a branch that
# is up to date with main, so the merged commit is the tested one.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the integration server
        run: npm ci --prefix Tools/integration-server
      - name: Build
        run: make build
      - name: Offline tests
        run: make test
      - name: Integration tests
        run: make integration
      - name: iOS build
        run: make build-ios

  docs:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: make docs
